// ─── Icon Component ───
function Icon({ name, filled, className = '' }) {
  return <span className={`material-symbols-outlined ${filled ? 'filled' : ''} ${className}`}>{name}</span>;
}

// ─── Toast System ───
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);

  const addToast = useCallback((message, type = 'success') => {
    const id = Date.now();
    setToasts(prev => [...prev, { id, message, type }]);
    setTimeout(() => {
      setToasts(prev => prev.filter(t => t.id !== id));
    }, 3500);
  }, []);

  const icons = { success: 'check_circle', error: 'error', warning: 'warning', info: 'info' };
  const colors = {
    success: 'bg-green-600', error: 'bg-red-600',
    warning: 'bg-amber-500', info: 'bg-blue-600'
  };

  return (
    <ToastContext.Provider value={addToast}>
      {children}
      <div className="fixed top-4 right-4 z-[999] flex flex-col gap-2 max-w-sm">
        {toasts.map(t => (
          <div key={t.id} className={`toast-enter ${colors[t.type]} text-white px-4 py-3 rounded-lg shadow-xl flex items-center gap-3 text-sm font-medium`}>
            <Icon name={icons[t.type]} filled className="text-xl flex-shrink-0" />
            <span>{t.message}</span>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}

function useToast() { return useContext(ToastContext); }

// ─── Confirm Modal ───
function ConfirmModal({ open, title, message, onConfirm, onCancel }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 modal-backdrop bg-black/40" onClick={onCancel}>
      <div className="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full animate-scaleIn" onClick={e => e.stopPropagation()}>

        </div>

  );
}

// ─── Data Entry Page (Lançamento) ───
function LancamentoPage() {
  const toast = useToast();
  const [cirurgioes, setCirurgioes] = useState([]);
  const [tipos, setTipos] = useState([]);
  const [loading, setLoading] = useState(false);
  const [form, setForm] = useState({
    data_atendimento: new Date().toISOString().split('T')[0],
    prontuario: '',
    nome_paciente: '',
    idade: '',
    tipo_cirurgia_id: '',
    status_pendente: true,
    motivo_pendente: '',
    cirurgiao_id: '',
    cirurgia_realizada: false,
  });

  useEffect(() => {
    loadSelects();
  }, []);

  async function loadSelects() {
    try {
      const [cRes, tRes] = await Promise.all([
        db.from('cirurgioes').select('*').eq('ativo', true).order('nome'),
        db.from('tipos_cirurgia').select('*').eq('ativo', true).order('descricao'),
      ]);
      if (cRes.data) setCirurgioes(cRes.data);
      if (tRes.data) setTipos(tRes.data);
    } catch (err) {
      toast('Erro ao carregar dados.', 'error');
    }
  }

  function handleChange(field, value) {
    setForm(prev => {
      const updated = { ...prev, [field]: value };
      if (field === 'cirurgia_realizada' && value === true) {
        updated.status_pendente = false;
        updated.motivo_pendente = '';
      }
      if (field === 'status_pendente' && value === false) {
        updated.motivo_pendente = '';
      }
      return updated;
    });
  }

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.prontuario || !form.nome_paciente || !form.idade || !form.tipo_cirurgia_id || !form.cirurgiao_id) {
      toast('Preencha todos os campos obrigatórios.', 'warning');
      return;
    }
    setLoading(true);
    try {
      const { error } = await db.from('cirurgias').insert([{
        ...form,
        idade: parseInt(form.idade),
      }]);
      if (error) throw error;
      toast('Cirurgia registrada com sucesso!', 'success');
      setForm({
        data_atendimento: new Date().toISOString().split('T')[0],
        prontuario: '', nome_paciente: '', idade: '',
        tipo_cirurgia_id: '', status_pendente: true,
        motivo_pendente: '',
        cirurgiao_id: '', cirurgia_realizada: false,
      });
    } catch (err) {
      toast('Erro ao salvar: ' + (err.message || 'desconhecido'), 'error');
    }
    setLoading(false);
  }

  return (
    <div className="animate-fadeIn">
      <PageHeader title="Lançamento de Cirurgia" subtitle="Registrar nova solicitação de cirurgia" icon="post_add" />

      <div className="bg-white rounded-xl shadow-sm border border-slate-200/60 p-6 md:p-8 max-w-3xl">
        <form onSubmit={handleSubmit} className="space-y-5">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            {/* Data */}
            <div>
              <label className="block text-sm font-semibold text-slate-700 mb-1.5">Data de Atendimento</label>
              <input type="date" value={form.data_atendimento} onChange={e => handleChange('data_atendimento', e.target.value)}
                className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm" />
            </div>
            {/* Prontuario */}
            <div>
              <label className="block text-sm font-semibold text-slate-700 mb-1.5">Prontuário *</label>
              <input type="text" value={form.prontuario} onChange={e => handleChange('prontuario', e.target.value)} placeholder="Nº do prontuário"
                className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm placeholder:text-slate-400" />
            </div>
            {/* Nome */}
            <div className="md:col-span-2">
              <label className="block text-sm font-semibold text-slate-700 mb-1.5">Nome do Paciente *</label>
              <input type="text" value={form.nome_paciente} onChange={e => handleChange('nome_paciente', e.target.value)} placeholder="Nome completo do paciente"
                className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm placeholder:text-slate-400" />
            </div>
            {/* Idade */}
            <div>
              <label className="block text-sm font-semibold text-slate-700 mb-1.5">Idade *</label>
              <input type="number" min="0" max="150" value={form.idade} onChange={e => handleChange('idade', e.target.value)} placeholder="Idade"
                className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm placeholder:text-slate-400" />
            </div>
            {/* Tipo Cirurgia */}
            <div>
              <label className="block text-sm font-semibold text-slate-700 mb-1.5">Cirurgia a ser Realizada *</label>
              <select value={form.tipo_cirurgia_id} onChange={e => handleChange('tipo_cirurgia_id', e.target.value)}
                className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm">
                <option value="">Selecione...</option>
                {tipos.map(t => <option key={t.id} value={t.id}>{t.descricao}</option>)}
              </select>
            </div>
            {/* Cirurgião */}
            <div>
              <label className="block text-sm font-semibold text-slate-700 mb-1.5">Cirurgião *</label>
              <select value={form.cirurgiao_id} onChange={e => handleChange('cirurgiao_id', e.target.value)}
                className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-sm">
                <option value="">Selecione...</option>
                {cirurgioes.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
              </select>
            </div>
            {/* Toggles */}
            <div className="flex items-center gap-8 md:col-span-2 pt-2">
              <div className="flex items-center gap-3">
                <label className="toggle-switch">
                  <input type="checkbox" checked={form.status_pendente} onChange={e => handleChange('status_pendente', e.target.checked)} />
                  <span className="toggle-slider"></span>
                </label>
                <span className="text-sm font-medium text-slate-700">Status Pendente</span>
              </div>
              <div className="flex items-center gap-3">
                <label className="toggle-switch">
                  <input type="checkbox" checked={form.cirurgia_realizada} onChange={e => handleChange('cirurgia_realizada', e.target.checked)} />
                  <span className="toggle-slider"></span>
                </label>
                <span className="text-sm font-medium text-slate-700">Cirurgia Realizada</span>
              </div>
            </div>
            {/* Motivo Pendente */}
            {form.status_pendente && (
              <div className="md:col-span-2 animate-fadeIn">
                <label className="block text-sm font-semibold text-slate-700 mb-1.5">
                  <span className="flex items-center gap-1.5">
                    <Icon name="pending_actions" className="text-amber-500 text-base" />
                    O que está pendente?
                  </span>
                </label>
                <input type="text" value={form.motivo_pendente} onChange={e => handleChange('motivo_pendente', e.target.value)}
                  placeholder="Ex: Risco cardiológico, exames de sangue, avaliação pré-anestésica..."
                  className="w-full px-3.5 py-2.5 bg-amber-50 border border-amber-200 rounded-lg text-slate-900 focus:ring-2 focus:ring-amber-300/40 focus:border-amber-400 outline-none transition-all text-sm placeholder:text-amber-400/70" />
              </div>
            )}
          </div>

          <div className="pt-3">
            <button type="submit" disabled={loading}
              className="bg-primary hover:bg-primary-dark disabled:opacity-60 text-white font-bold px-8 py-3 rounded-lg shadow-md shadow-primary/20 transition-all flex items-center gap-2">
              {loading ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : <Icon name="save" className="text-xl" />}
              Salvar Registro
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

// ─── Overview Page (Visão Geral) ───
function VisaoPage() {
  const toast = useToast();
  const [cirurgias, setCirurgias] = useState([]);
  const [cirurgioes, setCirurgioes] = useState([]);
  const [tipos, setTipos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editItem, setEditItem] = useState(null);
  const [deleteId, setDeleteId] = useState(null);
  const [motivoPopover, setMotivoPopover] = useState(null);
  const [filters, setFilters] = useState({ esteMes: false, tipo: '', pendente: '', cirurgiao: '', realizada: '' });

  useEffect(() => { loadAll(); }, []);

  async function loadAll() {
    setLoading(true);
    try {
      const [cRes, tRes, sRes] = await Promise.all([
        db.from('cirurgioes').select('*').order('nome'),
        db.from('tipos_cirurgia').select('*').order('descricao'),
        db.from('cirurgias').select('*, cirurgioes(nome), tipos_cirurgia(descricao)').order('data_atendimento', { ascending: false }),
      ]);
      if (cRes.data) setCirurgioes(cRes.data);
      if (tRes.data) setTipos(tRes.data);
      if (sRes.data) setCirurgias(sRes.data);
    } catch (err) {
      toast('Erro ao carregar dados.', 'error');
    }
    setLoading(false);
  }

  const filtered = useMemo(() => {
    return cirurgias.filter(c => {
      if (filters.esteMes) {
        const now = new Date();
        const d = new Date(c.data_atendimento + 'T00:00:00');
        if (d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear()) return false;
      }
      if (filters.tipo && c.tipo_cirurgia_id !== filters.tipo) return false;
      if (filters.pendente === 'sim' && !c.status_pendente) return false;
      if (filters.pendente === 'nao' && c.status_pendente) return false;
      if (filters.cirurgiao && c.cirurgiao_id !== filters.cirurgiao) return false;
      if (filters.realizada === 'sim' && !c.cirurgia_realizada) return false;
      if (filters.realizada === 'nao' && c.cirurgia_realizada) return false;
      return true;
    });
  }, [cirurgias, filters]);

  async function handleDelete() {
    if (!deleteId) return;
    try {
      const { error } = await db.from('cirurgias').delete().eq('id', deleteId);
      if (error) throw error;
      toast('Registro excluído.', 'success');
      setCirurgias(prev => prev.filter(c => c.id !== deleteId));
    } catch (err) {
      toast('Erro ao excluir.', 'error');
    }
    setDeleteId(null);
  }

  async function handleEditSave() {
    if (!editItem) return;
    try {
      const { id, cirurgioes: _c, tipos_cirurgia: _t, created_at, ...data } = editItem;
      data.idade = parseInt(data.idade);
      const { error } = await db.from('cirurgias').update(data).eq('id', id);
      if (error) throw error;
      toast('Registro atualizado!', 'success');
      setEditItem(null);
      loadAll();
    } catch (err) {
      toast('Erro ao atualizar.', 'error');
    }
  }

  function formatDate(d) {
    if (!d) return '-';
    const parts = d.split('-');
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function Badge({ yes, labelYes = 'Sim', labelNo = 'Não' }) {
    return (
      <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold ${yes ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500'}`}>
        <span className={`w-1.5 h-1.5 rounded-full ${yes ? 'bg-green-500' : 'bg-slate-400'}`}></span>
        {yes ? labelYes : labelNo}
      </span>

  return (
    <div className="animate-fadeIn">
      <PageHeader title="Visão Geral" subtitle={`${filtered.length} registro(s) encontrado(s)`} icon="table_chart" />

      {/* Filters */}

            <input type="checkbox" checked={filters.esteMes} onChange={e => setFilters(f => ({...f, esteMes: e.target.checked}))}
              className="rounded border-slate-300 text-primary focus:ring-primary" />
            <span className="text-xs font-medium text-slate-600">Este mês</span>

// ─── Dashboard Page ───
function DashboardPage() {
  const toast = useToast();
  const [stats, setStats] = useState({ total: 0, totalMes: 0, realizadas: 0, pendentes: 0 });
  const [porCirurgiao, setPorCirurgiao] = useState({});
  const [porTipo, setPorTipo] = useState({});
  const [evolucao, setEvolucao] = useState([]);
  const [loading, setLoading] = useState(true);
  const barRef = useRef(null);
  const pieRef = useRef(null);
  const lineRef = useRef(null);
  const chartInstances = useRef({});

  useEffect(() => {
    loadDashboard();
    return () => {
      Object.values(chartInstances.current).forEach(c => c?.destroy());
    };
  }, []);

  async function loadDashboard() {
    setLoading(true);
    try {
      const { data, error } = await db.from('cirurgias').select('*, cirurgioes(nome), tipos_cirurgia(descricao)');
      if (error) throw error;

      const now = new Date();
      const thisMonth = data.filter(d => {
        const dt = new Date(d.data_atendimento + 'T00:00:00');
        return dt.getMonth() === now.getMonth() && dt.getFullYear() === now.getFullYear();
      });

      setStats({
        total: data.length,
        totalMes: thisMonth.length,
        realizadas: data.filter(d => d.cirurgia_realizada).length,
        pendentes: data.filter(d => d.status_pendente).length,
      });

      const byC = {};
      data.forEach(d => {
        const name = d.cirurgioes?.nome || 'Sem cirurgião';
        byC[name] = (byC[name] || 0) + 1;
      });
      setPorCirurgiao(byC);

      const byT = {};
      data.forEach(d => {
        const name = d.tipos_cirurgia?.descricao || 'Sem tipo';
        byT[name] = (byT[name] || 0) + 1;
      });
      setPorTipo(byT);

      const months = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const m = d.getMonth();
        const y = d.getFullYear();
        const label = d.toLocaleString('pt-BR', { month: 'short', year: '2-digit' });
        const solicitadas = data.filter(r => {
          const dt = new Date(r.data_atendimento + 'T00:00:00');
          return dt.getMonth() === m && dt.getFullYear() === y;
        }).length;
        const realizadasM = data.filter(r => {
          const dt = new Date(r.data_atendimento + 'T00:00:00');
          return dt.getMonth() === m && dt.getFullYear() === y && r.cirurgia_realizada;
        }).length;
        months.push({ label, solicitadas, realizadas: realizadasM });
      }
      setEvolucao(months);

      setTimeout(() => buildCharts(byC, byT, months), 100);
    } catch (err) {
      toast('Erro ao carregar dashboard.', 'error');
    }
    setLoading(false);
  }

  function buildCharts(byC, byT, months) {
    Object.values(chartInstances.current).forEach(c => c?.destroy());

    const colors = ['#2563eb','#0ea5e9','#8b5cf6','#ec4899','#f59e0b','#22c55e','#ef4444','#6366f1'];

    if (barRef.current) {
      chartInstances.current.bar = new Chart(barRef.current, {
        type: 'bar',
        data: {
          labels: Object.keys(byC),
          datasets: [{ label: 'Cirurgias', data: Object.values(byC), backgroundColor: colors.slice(0, Object.keys(byC).length), borderRadius: 6, maxBarThickness: 50 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
      });
    }

    if (pieRef.current) {
      chartInstances.current.pie = new Chart(pieRef.current, {
        type: 'doughnut',
        data: {
          labels: Object.keys(byT),
          datasets: [{ data: Object.values(byT), backgroundColor: colors.slice(0, Object.keys(byT).length), borderWidth: 0, hoverOffset: 6 }]
        },
        options: { responsive: true, maintainAspectRatio: false, cutout: '55%', plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, pointStyleWidth: 8, font: { size: 11 } } } } }
      });
    }

    if (lineRef.current) {
      chartInstances.current.line = new Chart(lineRef.current, {
        type: 'line',
        data: {
          labels: months.map(m => m.label),
          datasets: [
            { label: 'Solicitadas', data: months.map(m => m.solicitadas), borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.08)', fill: true, tension: 0.4, pointRadius: 4, pointBackgroundColor: '#2563eb' },
            { label: 'Realizadas', data: months.map(m => m.realizadas), borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.08)', fill: true, tension: 0.4, pointRadius: 4, pointBackgroundColor: '#22c55e' }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { labels: { usePointStyle: true, pointStyleWidth: 8, font: { size: 11 } } } } }
      });
    }
  }

  function StatCard({ icon, label, value, sub, color }) {
    return (
      <div className="bg-white rounded-xl shadow-sm border border-slate-200/60 p-5 flex items-start gap-4">
        <div className={`${color} p-2.5 rounded-xl`}>
          <Icon name={icon} filled className="text-2xl" />
        </div>
        <div>
          <p className="text-2xl font-bold text-slate-800">{value}</p>
          <p className="text-sm text-slate-500 font-medium">{label}</p>
          {sub && <p className="text-xs text-slate-400 mt-0.5">{sub}</p>}
        </div>
      </div>
    );
  }

  if (loading) {
    return (
      <div className="flex items-center justify-center py-32">
        <div className="w-10 h-10 border-2 border-primary/20 border-t-primary rounded-full animate-spin"></div>
      </div>
    );
  }

  return (
    <div className="animate-fadeIn">
      <PageHeader title="Dashboard" subtitle="Visão analítica das cirurgias" icon="dashboard" />

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <StatCard icon="assignment" label="Total de Cirurgias" value={stats.total} sub={`${stats.totalMes} este mês`} color="bg-blue-50 text-blue-600" />
        <StatCard icon="check_circle" label="Realizadas" value={stats.realizadas} color="bg-green-50 text-green-600" />
        <StatCard icon="pending" label="Pendentes" value={stats.pendentes} color="bg-amber-50 text-amber-600" />
        <StatCard icon="trending_up" label="Taxa Realização" value={stats.total > 0 ? Math.round(stats.realizadas / stats.total * 100) + '%' : '0%'} color="bg-purple-50 text-purple-600" />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
        <div className="bg-white rounded-xl shadow-sm border border-slate-200/60 p-5">
          <h3 className="font-semibold text-slate-800 text-sm mb-4 flex items-center gap-2">
            <Icon name="bar_chart" className="text-primary text-lg" /> Cirurgias por Cirurgião
          </h3>
          <div style={{height: '260px'}}><canvas ref={barRef}></canvas></div>
        </div>
        <div className="bg-white rounded-xl shadow-sm border border-slate-200/60 p-5">
          <h3 className="font-semibold text-slate-800 text-sm mb-4 flex items-center gap-2">
            <Icon name="donut_large" className="text-primary text-lg" /> Cirurgias por Tipo
          </h3>
          <div style={{height: '260px'}}><canvas ref={pieRef}></canvas></div>
        </div>
      </div>
      <div className="bg-white rounded-xl shadow-sm border border-slate-200/60 p-5">
        <h3 className="font-semibold text-slate-800 text-sm mb-4 flex items-center gap-2">
          <Icon name="show_chart" className="text-primary text-lg" /> Evolução Mensal
        </h3>
        <div style={{height: '280px'}}><canvas ref={lineRef}></canvas></div>
      </div>
    </div>
  );
}

// ─── Management Page ───
function GerenciamentoPage() {
  const toast = useToast();
  const [tab, setTab] = useState('cirurgioes');
  const [cirurgioes, setCirurgioes] = useState([]);
  const [tipos, setTipos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [newName, setNewName] = useState('');
  const [editId, setEditId] = useState(null);
  const [editValue, setEditValue] = useState('');

  useEffect(() => { loadData(); }, []);

  async function loadData() {
    setLoading(true);
    try {
      const [cRes, tRes] = await Promise.all([
        db.from('cirurgioes').select('*').order('nome'),
        db.from('tipos_cirurgia').select('*').order('descricao'),
      ]);
      if (cRes.data) setCirurgioes(cRes.data);
      if (tRes.data) setTipos(tRes.data);
    } catch (err) {
      toast('Erro ao carregar dados.', 'error');
    }
    setLoading(false);
  }

  async function handleAdd() {
    if (!newName.trim()) { toast('Preencha o nome/descrição.', 'warning'); return; }
    const table = tab === 'cirurgioes' ? 'cirurgioes' : 'tipos_cirurgia';
    const field = tab === 'cirurgioes' ? 'nome' : 'descricao';
    try {
      const { error } = await db.from(table).insert([{ [field]: newName.trim() }]);
      if (error) throw error;
      toast(`${tab === 'cirurgioes' ? 'Cirurgião' : 'Tipo'} adicionado!`, 'success');
      setNewName('');
      loadData();
    } catch (err) {
      toast('Erro ao adicionar.', 'error');
    }
  }

  async function handleToggleAtivo(item) {
    const table = tab === 'cirurgioes' ? 'cirurgioes' : 'tipos_cirurgia';
    try {
      const { error } = await db.from(table).update({ ativo: !item.ativo }).eq('id', item.id);
      if (error) throw error;
      toast(`Status atualizado.`, 'success');
      loadData();
    } catch (err) {
      toast('Erro ao atualizar status.', 'error');
    }
  }

  async function handleEditSave(id) {
    if (!editValue.trim()) return;
    const table = tab === 'cirurgioes' ? 'cirurgioes' : 'tipos_cirurgia';
    const field = tab === 'cirurgioes' ? 'nome' : 'descricao';
    try {
      const { error } = await db.from(table).update({ [field]: editValue.trim() }).eq('id', id);
      if (error) throw error;
      toast('Atualizado!', 'success');
      setEditId(null);
      setEditValue('');
      loadData();
    } catch (err) {
      toast('Erro ao editar.', 'error');
    }
  }

  const items = tab === 'cirurgioes' ? cirurgioes : tipos;
  const displayField = tab === 'cirurgioes' ? 'nome' : 'descricao';

  return (
    <div className="animate-fadeIn">
      <PageHeader title="Gerenciamento" subtitle="Cadastros do sistema" icon="settings" />

      <div className="flex gap-1 bg-slate-100 p-1 rounded-xl w-fit mb-6">
        <button onClick={() => { setTab('cirurgioes'); setEditId(null); setNewName(''); }}
          className={`px-5 py-2 rounded-lg text-sm font-semibold transition-all ${tab === 'cirurgioes' ? 'bg-white text-primary shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
          <span className="flex items-center gap-1.5"><Icon name="person" className="text-lg" /> Cirurgiões</span>
        </button>
        <button onClick={() => { setTab('tipos'); setEditId(null); setNewName(''); }}
          className={`px-5 py-2 rounded-lg text-sm font-semibold transition-all ${tab === 'tipos' ? 'bg-white text-primary shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>
          <span className="flex items-center gap-1.5"><Icon name="healing" className="text-lg" /> Tipos de Cirurgia</span>
        </button>
      </div>

      <div className="bg-white rounded-xl shadow-sm border border-slate-200/60 p-6 max-w-2xl">
        <div className="flex gap-3 mb-6">
          <input type="text" value={newName} onChange={e => setNewName(e.target.value)}
            placeholder={tab === 'cirurgioes' ? 'Nome do cirurgião' : 'Descrição do tipo de cirurgia'}
            onKeyDown={e => e.key === 'Enter' && handleAdd()}
            className="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-900 outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary placeholder:text-slate-400" />
          <button onClick={handleAdd}
            className="bg-primary hover:bg-primary-dark text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-1.5 shadow-sm">
            <Icon name="add" className="text-lg" /> Adicionar
          </button>
        </div>

        {loading ? (
          <div className="flex justify-center py-8"><div className="w-7 h-7 border-2 border-primary/20 border-t-primary rounded-full animate-spin"></div></div>
        ) : items.length === 0 ? (
          <p className="text-sm text-slate-400 text-center py-8">Nenhum item cadastrado.</p>
        ) : (
          <div className="space-y-2">
            {items.map(item => (
              <div key={item.id} className={`flex items-center gap-3 p-3 rounded-lg border transition-all ${item.ativo ? 'border-slate-200 bg-white' : 'border-slate-100 bg-slate-50 opacity-60'}`}>
                {editId === item.id ? (
                  <div className="flex-1 flex items-center gap-2">
                    <input type="text" value={editValue} onChange={e => setEditValue(e.target.value)} autoFocus
                      onKeyDown={e => { if (e.key === 'Enter') handleEditSave(item.id); if (e.key === 'Escape') setEditId(null); }}
                      className="flex-1 px-3 py-1.5 bg-slate-50 border border-primary/30 rounded-lg text-sm outline-none focus:ring-2 focus:ring-primary/20" />
                    <button onClick={() => handleEditSave(item.id)} className="p-1.5 rounded-lg hover:bg-green-50 text-green-600 transition-colors">
                      <Icon name="check" className="text-lg" />
                    </button>
                    <button onClick={() => setEditId(null)} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-400 transition-colors">
                      <Icon name="close" className="text-lg" />
                    </button>
                  </div>
                ) : (
                  <>
                    <div className={`w-2 h-2 rounded-full flex-shrink-0 ${item.ativo ? 'bg-green-500' : 'bg-slate-300'}`}></div>
                    <span className="flex-1 text-sm font-medium text-slate-700">{item[displayField]}</span>
                    <button onClick={() => { setEditId(item.id); setEditValue(item[displayField]); }}
                      className="p-1.5 rounded-lg hover:bg-blue-50 text-slate-400 hover:text-primary transition-colors" title="Editar">
                      <Icon name="edit" className="text-lg" />
                    </button>
                    <button onClick={() => handleToggleAtivo(item)}
                      className={`p-1.5 rounded-lg transition-colors ${item.ativo ? 'hover:bg-amber-50 text-slate-400 hover:text-amber-500' : 'hover:bg-green-50 text-slate-400 hover:text-green-500'}`}
                      title={item.ativo ? 'Desativar' : 'Ativar'}>
                      <Icon name={item.ativo ? 'toggle_on' : 'toggle_off'} className="text-lg" />
                    </button>
                  </>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Main App ───
function App() {
  const [authenticated, setAuthenticated] = useState(() => sessionStorage.getItem('cad_auth') === 'true');
  const [currentPage, setCurrentPage] = useState('lancamento');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

  function handleLogout() {
    sessionStorage.removeItem('cad_auth');
    setAuthenticated(false);
  }

  if (!authenticated) {
    return (
      <ToastProvider>
        <LoginPage onLogin={() => setAuthenticated(true)} />
      </ToastProvider>
    );
  }

  const pages = {
    lancamento: <LancamentoPage />,
    visao: <VisaoPage />,
    dashboard: <DashboardPage />,
    gerenciamento: <GerenciamentoPage />,
  };

  return (
    <ToastProvider>
      <div className="min-h-screen bg-surface">
        <Sidebar currentPage={currentPage} onNavigate={setCurrentPage} onLogout={handleLogout}
          collapsed={sidebarCollapsed} onToggle={() => setSidebarCollapsed(c => !c)} />
        <main className={`transition-all duration-300 min-h-screen ${sidebarCollapsed ? 'ml-[68px]' : 'ml-60'}`}>
          <header className="bg-white/80 backdrop-blur-md border-b border-slate-200/60 sticky top-0 z-40">
            <div className="px-6 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-2 text-sm text-slate-500">
                <Icon name="home" className="text-lg text-slate-400" />
                <span>/</span>
                <span className="text-slate-700 font-medium capitalize">{currentPage === 'visao' ? 'Visão Geral' : currentPage}</span>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-xs text-slate-400 hidden sm:block">{new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</span>
                <div className="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center">
                  <Icon name="person" filled className="text-primary text-sm" />
                </div>
              </div>
            </div>
          </header>
          <div className="p-6">{pages[currentPage]}</div>
        </main>
      </div>
    </ToastProvider>
  );
}

// ─── Mount ───
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
